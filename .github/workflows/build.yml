name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Pantalla completa, icono, nombre y orientacion
        run: node tools/patch-android.js
      - name: Verificar que el parche quedo aplicado
        run: |
          grep -q "hideBars" android/app/src/main/java/com/metalhero/touch/MainActivity.java
          grep -q "windowFullscreen" android/app/src/main/res/values/styles.xml
          grep -q "fullSensor" android/app/src/main/AndroidManifest.xml
          grep -q "Pocket Hero" android/app/src/main/res/values/strings.xml
          grep -q "ic_launcher_bg" android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          echo "Parche de pantalla completa OK"
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-hero-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
